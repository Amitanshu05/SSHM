# Backend server port
# Render provides PORT automatically. Local fallback is 8081.
server.port=${PORT:8081}

# App name
spring.application.name=storage-health-api

# SQLite database path
# Local default points to the Python worker DB. Render can override SQLITE_DB_PATH.
spring.datasource.url=jdbc:sqlite:${SQLITE_DB_PATH:D:/Smart Storage Health Monitor/engine/storage_health.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite does not need username/password
spring.datasource.username=
spring.datasource.password=

# Hibernate SQLite dialect
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Very important:
# Python already created the tables.
# Spring Boot should NOT create/drop/change them.
spring.jpa.hibernate.ddl-auto=none

# Creates tables and demo seed rows when deployed with an empty SQLite file.
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Show SQL queries in terminal while developing
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQLite is file-based, so keep DB connection pool small
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-timeout=10000

# Better error messages during development
server.error.include-message=always

# Optional shared secret for local-agent -> cloud ingest.
app.ingest.api-key=${INGEST_API_KEY:}
